      # ── Preisplan (Schattenmodus) ────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Preisplan (Schattenmodus – steuert nichts)
            icon: mdi:chart-timeline-variant

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_preisplan_schattenmodus
                name: Preisplan berechnen
              - entity: number.e3dc_maestro_preisplan_ziel_soc_obergrenze
                name: Ziel-SoC Obergrenze (%)
              - entity: number.e3dc_maestro_preisplan_mindest_preisspanne
                name: Mindest-Preisspanne (€/kWh)
              - entity: number.e3dc_maestro_preisplan_wirkungsgrad
                name: Wirkungsgrad Laden/Entladen (0–1)
              - entity: number.e3dc_maestro_preisplan_verbrauchs_sicherheitsfaktor
                name: Verbrauchs-Sicherheitsfaktor
              - entity: sensor.e3dc_maestro_preisplan
                name: Empfehlung
              - type: attribute
                entity: sensor.e3dc_maestro_preisplan
                attribute: message
                name: Begründung
              - type: attribute
                entity: sensor.e3dc_maestro_preisplan
                attribute: total_grid_charge_kwh
                name: Geplante Netzladung
                suffix: kWh
              - type: attribute
                entity: sensor.e3dc_maestro_preisplan
                attribute: expected_saving_eur
                name: Erwartete Ersparnis
                suffix: €
              - type: attribute
                entity: sensor.e3dc_maestro_preisplan
                attribute: known_until
                name: Preise bekannt bis
                format: datetime
              - type: button
                name: "ℹ️  Hilfe zum Preisplan"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-preisplan

          - type: custom:apexcharts-card
            chart_type: line
            graph_span: 36h
            span:
              start: hour
            header:
              title: Preisplan – Preise, Netzladung und Halten
              show: true
              show_states: false
            apex_config:
              chart:
                height: 220
              stroke:
                width: [2, 5, 5]
                curve: straight
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
                  format: HH:mm
              legend:
                show: true
            yaxis:
              - min: 0
                decimals: 0
                apex_config:
                  title:
                    text: ct/kWh
            series:
              - entity: sensor.e3dc_maestro_preisplan
                name: Preis
                type: line
                color: "#90a4ae"
                show:
                  in_header: false
                data_generator: |
                  const rows = entity.attributes.plan_slots || [];
                  const pts = [];
                  rows.forEach(r => {
                    const s = new Date(r.start).getTime();
                    const e = s + r.hours * 3600000 - 1000;
                    const y = Math.round(r.price * 1000) / 10;
                    pts.push([s, y]);
                    pts.push([e, y]);
                  });
                  return pts;
              - entity: sensor.e3dc_maestro_preisplan
                name: Netzladung
                type: line
                color: "#43a047"
                show:
                  in_header: false
                data_generator: |
                  const rows = entity.attributes.plan_slots || [];
                  const pts = [];
                  rows.forEach(r => {
                    const s = new Date(r.start).getTime();
                    const e = s + r.hours * 3600000 - 1000;
                    const y = Math.round(r.price * 1000) / 10;
                    if (r.grid_charge_kwh > 0) { pts.push([s, y]); pts.push([e, y]); }
                    else { pts.push([s, null]); }
                  });
                  return pts;
              - entity: sensor.e3dc_maestro_preisplan
                name: Entladung halten
                type: line
                color: "#fb8c00"
                show:
                  in_header: false
                data_generator: |
                  const rows = entity.attributes.plan_slots || [];
                  const pts = [];
                  rows.forEach(r => {
                    const s = new Date(r.start).getTime();
                    const e = s + r.hours * 3600000 - 1000;
                    const y = Math.round(r.price * 1000) / 10;
                    if (r.grid_charge_kwh <= 0 && r.hold) { pts.push([s, y]); pts.push([e, y]); }
                    else { pts.push([s, null]); }
                  });
                  return pts;

          - type: custom:apexcharts-card
            chart_type: line
            graph_span: 36h
            span:
              start: hour
            header:
              title: Preisplan – geplanter SoC
              show: true
              show_states: false
            apex_config:
              chart:
                height: 160
              stroke:
                width: 3
                curve: stepline
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
                  format: HH:mm
              legend:
                show: false
            yaxis:
              - min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: SoC %
            series:
              - entity: sensor.e3dc_maestro_preisplan
                name: SoC (Plan)
                type: line
                color: "#1e88e5"
                show:
                  in_header: false
                data_generator: |
                  const rows = entity.attributes.plan_slots || [];
                  return rows.map(r => [new Date(r.start).getTime(), r.soc_pct]);

          - type: markdown
            content: >
              **Schattenmodus:** Der Plan wird aus der Preiskurve des
              Preis-Sensors (`raw_today` / `raw_tomorrow`), der PV-Prognose
              und dem Verbrauchsprofil berechnet und nur angezeigt.
              <font color="#43a047">Grün</font> = Netzladung geplant,
              <font color="#fb8c00">Orange</font> = Entladung halten
              (Akku-Energie für teurere Slots sparen). Konfiguration unter
              *Einstellungen → Integrationen → E3DC Maestro → Konfigurieren →
              Tarif* (Preisplan-Optionen).

      # ── Tarif-Slots ──────────────────────────────────────────────────
      - type: grid
        column_span: 2
