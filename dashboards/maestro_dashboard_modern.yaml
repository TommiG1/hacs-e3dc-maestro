                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-tariff-slots

          - type: markdown
            content: >
              **Tarif-Slots konfigurieren:** Über
              *Einstellungen → Integrationen → E3DC Maestro → Konfigurieren →
              Tarif-Slots* lassen sich beliebig viele Fenster
              (Wochentage, Uhrzeit, Klasse) anlegen.
              Klassen: `high` = Entladung nur bis zur Reserve (HT-Schutz),
              `low` = Netzladung erlaubt, `normal` = neutral.

