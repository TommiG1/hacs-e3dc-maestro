# =============================================================================
# E3DC Maestro – Modern Dashboard (Variante)
# =============================================================================
# Zweite, wählbare Dashboard-Version mit modernem Look.
# Das klassische Dashboard (dashboards/maestro_dashboard.yaml) bleibt unverändert.
#
# Voraussetzungen (HACS → Frontend):
#   - mini-graph-card        https://github.com/kalkih/mini-graph-card
#   - apexcharts-card        https://github.com/RomRider/apexcharts-card
#   - power-flow-card-plus   https://github.com/flixlix/power-flow-card-plus
#
# WICHTIG zum Slug / URL-Pfad:
#   Die Hilfe-Tabs verwenden interne Links wie /e3dc-maestro-modern/help-xyz.
#   Damit das funktioniert, MUSS der URL-Pfad des Dashboards exakt
#   `e3dc-maestro-modern` lauten. HA leitet diesen Slug aus dem Titel ab —
#   nenne das Dashboard daher beim Import "E3DC Maestro Modern", dann
#   stimmt der Slug automatisch.
#
# =============================================================================
# ▼▼▼ EINMALIG ANPASSEN: E3DC-Roh-Entitäten ▼▼▼
# -----------------------------------------------------------------------------
# Die folgenden Entity-IDs verweisen auf die Live-Leistungs- und SoC-Sensoren
# deiner E3DC-Anlage (z. B. aus der e3dc_rscp / e3dc-Integration).
# Ersetze sie ggf. durch deine echten Sensor-Namen — sie werden in der
# Power-Flow-Karte (Übersicht) und in der Live-Leistungs-Mini-Graph (Cockpit)
# verwendet.
#
#   sensor.e3dc_fronius_summe_solar_power  # PV gesamt (E3DC+Fronius, W, ≥ 0)
#   sensor.e3dc_power_consumption_house    # Hausverbrauch  (W, ≥ 0)
#   sensor.e3dc_grid_power                 # Netz (W, + = Bezug, − = Einspeisung)
#   sensor.e3dc_battery_power              # Akku (W, + = laden, − = entladen)
#   sensor.e3dc_maestro_aktueller_soc # Akku-Ladestand (%) — Maestro-Sensor
#
# Falls deine Sensoren andere Namen haben, ersetze sie unten in den
# Karten dieses Dashboards (Suche & Ersetzen über die ganze Datei).
# =============================================================================

title: E3DC Maestro Modern

# =============================================================================
# Wiederverwendbare button-card-Templates (nur für die Übersicht genutzt).
# Werden als JS-Templates evaluiert — referenzierbar via `template: <name>`.
# =============================================================================
button_card_templates:

  # ── Basis-Look: Room-Card-Stil mit Corner-Glow links unten ───────────────
  # variables.accent steuert Glow + Icon-Farbe global je Karte.
  base_card:
    show_name: true
    show_state: true
    show_icon: true
    show_label: false
    variables:
      accent: "var(--primary-color)"
    styles:
      card:
        - border-radius: 22px
        - padding: 16px 16px 14px 16px
        - background: "linear-gradient(160deg, color-mix(in srgb, var(--card-background-color) 92%, #000) 0%, var(--card-background-color) 55%, color-mix(in srgb, var(--card-background-color) 88%, #000) 100%)"
        - box-shadow: 0 6px 18px rgba(0,0,0,0.18)
        - transition: transform 0.18s ease, box-shadow 0.18s ease
        - border: 1px solid color-mix(in srgb, var(--primary-text-color) 7%, transparent)
        - overflow: hidden
        - position: relative
      grid:
        - grid-template-areas: '"n n" "s s" "i ."'
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: auto auto 1fr
        - row-gap: 2px
        - column-gap: 0
        - align-items: start
      name:
        - font-size: 14px
        - font-weight: 700
        - letter-spacing: -0.2px
        - text-transform: none
        - opacity: 0.92
        - justify-self: start
        - z-index: 2
        - position: relative
      state:
        - font-size: 24px
        - font-weight: 800
        - letter-spacing: -0.4px
        - justify-self: start
        - z-index: 2
        - position: relative
        - color: "[[[ return variables.accent ]]]"
        - margin-top: 2px
      img_cell:
        # Glow darf leicht überstehen (overflow:hidden), Icon bleibt voll sichtbar.
        - position: absolute
        - left: -6px
        - bottom: -10px
        - width: 108px
        - height: 108px
        - border-radius: 50%
        - background: |
            [[[
              const c = variables.accent || 'var(--primary-color)';
              return `radial-gradient(circle at 50% 50%,
                color-mix(in srgb, ${c} 55%, transparent) 0%,
                color-mix(in srgb, ${c} 22%, transparent) 42%,
                transparent 70%)`;
            ]]]
        - display: grid
        - place-items: center
        - padding: 0 0 10px 10px
        - box-sizing: border-box
        - z-index: 0
        - pointer-events: none
      icon:
        - width: 44px
        - height: 44px
        - --mdc-icon-size: 44px
        - color: "[[[ return variables.accent ]]]"
        - opacity: 0.92
        - filter: drop-shadow(0 2px 10px color-mix(in srgb, var(--primary-text-color) 18%, transparent))
        - margin: 0
    extra_styles: |
      ha-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 26px rgba(0,0,0,0.22);
      }
      @keyframes maestro-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.55; transform: scale(0.94); }
      }
      @keyframes maestro-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

  # ── KPI-Kachel (Corner-Glow + großer Wert) ───────────────────────────────
  kpi:
    template: base_card
    styles:
      card:
        - height: 132px

  # ── Mini-Chip rechts oben (nested button-card in custom_fields.chip) ─────
  quick_chip:
    show_name: true
    show_icon: false
    show_state: false
    variables:
      accent: "var(--primary-text-color)"
    styles:
      card:
        - padding: 5px 10px
        - border-radius: 10px
        - min-height: 0
        - height: auto
        - width: auto
        - box-shadow: none
        - cursor: pointer
        - background: "color-mix(in srgb, var(--primary-text-color) 9%, transparent)"
        - border: 1px solid color-mix(in srgb, var(--primary-text-color) 14%, transparent)
        - transition: background 0.15s ease, border-color 0.15s ease
      name:
        - font-size: 11px
        - font-weight: 700
        - letter-spacing: 0.15px
        - opacity: 0.92
        - white-space: nowrap
        - color: "[[[ return variables.accent ]]]"
    extra_styles: |
      ha-card:hover {
        background: color-mix(in srgb, var(--primary-text-color) 16%, transparent) !important;
        border-color: color-mix(in srgb, var(--primary-text-color) 28%, transparent) !important;
        transform: none;
        box-shadow: none;
      }

  # ── KPI mit Meta-Zeile + Quick-Chip rechts ───────────────────────────────
  kpi_enriched:
    template: kpi
    triggers_update: all
    styles:
      card:
        - height: 148px
      grid:
        - grid-template-areas: '"n chip" "s meta" "i ."'
        - grid-template-columns: 1fr auto
        - grid-template-rows: auto auto 1fr
        - column-gap: 8px
      name:
        - padding-right: 4px
      state:
        - padding-right: 4px
      custom_fields:
        meta:
          - grid-area: meta
          - z-index: 2
          - position: relative
          - justify-self: end
          - align-self: end
          - font-size: 11px
          - font-weight: 600
          - opacity: 0.72
          - text-align: right
          - line-height: 1.35
          - max-width: 148px
          - padding-bottom: 2px
          - color: var(--primary-text-color)
        chip:
          - grid-area: chip
          - z-index: 3
          - position: relative
          - justify-self: end
          - align-self: start
          - width: auto
          - min-width: 0
          - margin-top: -2px

  # ── Power-Tile: Vorzeichen → Farbe (grün = produziert/einspeist) ─────────
  power_tile:
    template: kpi
    variables:
      accent: "#78909c"
    state:
      - operator: template
        value: "[[[ return entity && !['unknown','unavailable',''].includes(entity.state) && parseFloat(entity.state) > 50 ]]]"
        styles:
          icon: [color: "#43a047"]
          label: [color: "#43a047"]
          img_cell:
            - background: "radial-gradient(circle at 50% 50%, color-mix(in srgb, #43a047 55%, transparent) 0%, color-mix(in srgb, #43a047 22%, transparent) 42%, transparent 70%)"
      - operator: template
        value: "[[[ return entity && !['unknown','unavailable',''].includes(entity.state) && parseFloat(entity.state) < -50 ]]]"
        styles:
          icon: [color: "#e53935"]
          label: [color: "#e53935"]
          img_cell:
            - background: "radial-gradient(circle at 50% 50%, color-mix(in srgb, #e53935 55%, transparent) 0%, color-mix(in srgb, #e53935 22%, transparent) 42%, transparent 70%)"
    label: |
      [[[
        if (!entity || ['unknown','unavailable',''].includes(entity.state)) return '—';
        const v = parseFloat(entity.state);
        if (isNaN(v)) return '—';
        return Math.abs(v) >= 1000
          ? (v / 1000).toFixed(2).replace('.', ',') + ' kW'
          : Math.round(v) + ' W';
      ]]]
    show_label: true
    show_state: false
    styles:
      label:
        - font-size: 24px
        - font-weight: 800
        - letter-spacing: -0.4px
        - justify-self: start
        - z-index: 2
        - position: relative
        - color: "[[[ return variables.accent ]]]"
        - margin-top: 2px
      grid:
        - grid-template-areas: '"n n" "l l" "i ."'

  # ── PV-spezifisch: Sonne, immer warm-gelb ────────────────────────────────
  pv_tile:
    template: power_tile
    variables:
      accent: "#f9a825"

  # ── Haus: warmes Braun ───────────────────────────────────────────────────
  house_tile:
    template: power_tile
    variables:
      accent: "#8d6e63"

  # ── Status-Chip: kompakt, leichter Corner-Glow, pulsiert wenn an ─────────
  status_chip:
    template: base_card
    show_state: false
    variables:
      accent: "var(--primary-color)"
    state:
      - value: "on"
        styles:
          icon:
            - animation: maestro-pulse 1.8s ease-in-out infinite
    styles:
      card:
        - height: 96px
        - padding: 12px 12px 10px 12px
      name:
        - font-size: 12px
        - font-weight: 600
        - opacity: 0.9
      img_cell:
        - left: -4px
        - bottom: -6px
        - width: 84px
        - height: 84px
        - padding: 0 0 8px 8px
      icon:
        - width: 34px
        - height: 34px
        - --mdc-icon-size: 34px
        - margin: 0
      grid:
        - grid-template-areas: '"n n" "i ."'
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: auto 1fr

  # ── Action-Tile (Toggle/Button) mit Corner-Glow + Meta/Chip rechts ───────
  action_tile:
    template: base_card
    size: 44px
    show_state: true
    triggers_update: all
    variables:
      accent: "var(--primary-color)"
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - height: 156px
        - cursor: pointer
      grid:
        - grid-template-areas: '"n chip" "s meta" "i ."'
        - grid-template-columns: 1fr auto
        - grid-template-rows: auto auto 1fr
        - column-gap: 8px
      name:
        - font-size: 13px
        - padding-right: 4px
      state:
        - font-size: 16px
        - font-weight: 700
        - padding-right: 4px
      img_cell:
        - left: -6px
        - bottom: -8px
        - width: 100px
        - height: 100px
        - padding: 0 0 10px 10px
      icon:
        - width: 44px
        - height: 44px
        - --mdc-icon-size: 44px
        - margin: 0
      custom_fields:
        meta:
          - grid-area: meta
          - z-index: 2
          - position: relative
          - justify-self: end
          - align-self: end
          - font-size: 11px
          - font-weight: 600
          - opacity: 0.72
          - text-align: right
          - line-height: 1.35
          - max-width: 140px
          - padding-bottom: 2px
          - color: var(--primary-text-color)
        chip:
          - grid-area: chip
          - z-index: 3
          - position: relative
          - justify-self: end
          - align-self: start
          - width: auto
          - min-width: 0
          - margin-top: -2px
    state:
      - value: "on"
        styles:
          card:
            - border: 1px solid color-mix(in srgb, var(--success-color) 40%, transparent)
          icon: [color: "var(--success-color)"]
          state: [color: "var(--success-color)"]
          img_cell:
            - background: "radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--success-color) 55%, transparent) 0%, color-mix(in srgb, var(--success-color) 22%, transparent) 42%, transparent 70%)"
      - value: "off"
        styles:
          icon: [color: "var(--disabled-text-color)"]
          state: [color: "var(--disabled-text-color)"]

  # ── Phase-Hero: groß, farbig je nach Phase, Subtitle aus Letzte-Aktion ──
  phase_hero:
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    triggers_update: all
    styles:
      card:
        - border-radius: 22px
        - padding: 22px 26px 20px 26px
        - min-height: 188px
        - background: |
            [[[
              const p = states['sensor.e3dc_maestro_regelphase'] ? states['sensor.e3dc_maestro_regelphase'].state : '';
              const low = states['binary_sensor.e3dc_maestro_akku_prioritat_aktiv'] && states['binary_sensor.e3dc_maestro_akku_prioritat_aktiv'].state === 'on';
              const palette = {
                off:                ['#455a64', '#607d8b'],
                manual:             ['#546e7a', '#78909c'],
                emergency:          ['#b71c1c', '#e53935'],
                feed_in_limit:      ['#e65100', '#fb8c00'],
                force_discharge:    ['#bf360c', '#ef6c00'],
                curtailment_guard:  ['#bf360c', '#ff7043'],
                reserve_protection: ['#0d47a1', '#1976d2'],
                evcc_pause:         ['#4a148c', '#7b1fa2'],
                ht_protection:      ['#4e342e', '#6d4c41'],
                pv_delay:           ['#1b5e20', '#43a047'],
                astro_wait:         ['#f57f17', '#fbc02d'],
                morning_cap:        ['#827717', '#afb42b'],
                morning_discharge:  ['#bf360c', '#ff7043'],
                hard_soc_limit:     ['#00695c', '#00897b'],
                fast_floor:         ['#2e7d32', '#66bb6a'],
                corridor:           ['#1565c0', '#1e88e5'],
                spreading:          ['#00695c', '#26a69a'],
                grid_charge:        ['#283593', '#5c6bc0'],
                idle:               ['#37474f', '#546e7a'],
                normal:             ['#1b5e20', '#2e7d32']
              };
              const colors = low ? ['#e65100', '#fb8c00'] : (palette[p] || ['#37474f', '#546e7a']);
              return `linear-gradient(135deg, ${colors[0]} 0%, ${colors[1]} 100%)`;
            ]]]
        - color: white
        - box-shadow: 0 10px 30px rgba(0,0,0,0.22)
        - overflow: hidden
        - position: relative
      grid:
        - grid-template-areas: '"title badge" "subtitle subtitle" "forecast forecast" "glow ."'
        # minmax(0,1fr): sonst sprengt langer Forecast-Text die Karte auf Mobile
        - grid-template-columns: minmax(0, 1fr) auto
        - grid-template-rows: min-content min-content min-content 72px
        - row-gap: 0
        - column-gap: 10px
        - min-height: 188px
        - width: 100%
      custom_fields:
        # Deko-Glow links unten — Badge bleibt oben rechts, kein Overlap.
        glow:
          - grid-area: glow
          - position: absolute
          - left: -8px
          - bottom: -12px
          - width: 120px
          - height: 120px
          - border-radius: 50%
          - background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.08) 42%, transparent 70%)
          - display: grid
          - place-items: center
          - padding: 0 0 12px 12px
          - box-sizing: border-box
          - pointer-events: none
          - z-index: 0
          - color: rgba(255,255,255,0.95)
        title:
          - grid-area: title
          - position: relative
          - z-index: 1
          - font-size: 28px
          - font-weight: 800
          - line-height: 1.15
          - letter-spacing: -0.5px
          - min-width: 0
          - overflow-wrap: anywhere
        subtitle:
          - grid-area: subtitle
          - position: relative
          - z-index: 1
          - font-size: 13px
          - opacity: 0.85
          - margin-top: 10px
          - line-height: 1.4
          - padding-right: 0
          - max-width: 100%
          - min-width: 0
          - white-space: normal
          - overflow-wrap: break-word
        forecast:
          - grid-area: forecast
          - position: relative
          - z-index: 1
          - margin-top: 10px
          - padding: 8px 10px
          - border-radius: 12px
          - background: rgba(0,0,0,0.22)
          - border: 1px solid rgba(255,255,255,0.22)
          - font-size: 12px
          - font-weight: 600
          - letter-spacing: 0
          - line-height: 1.45
          - width: 100%
          - max-width: 100%
          - min-width: 0
          - box-sizing: border-box
          - white-space: normal
          - overflow-wrap: anywhere
          - word-break: break-word
          - display: |
              [[[
                const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                const def = states['sensor.e3dc_maestro_morgen_energiedefizit'];
                const weak = states['binary_sensor.e3dc_maestro_schwacher_pv_tag'];
                const phase = states['sensor.e3dc_maestro_regelphase'];
                const socE = states['sensor.e3dc_maestro_aktueller_soc'];
                const d = def && ok(def.state) ? parseFloat(def.state) : NaN;
                const soc = socE && ok(socE.state) ? parseFloat(socE.state) : NaN;
                const p = phase ? phase.state : '';
                const lowSoc = p === 'fast_floor' || (!isNaN(soc) && soc < 40);
                const show = (!isNaN(d) && d >= 0.5) || (weak && weak.state === 'on') || lowSoc;
                return show ? 'block' : 'none';
              ]]]
        badge:
          - grid-area: badge
          - position: relative
          - z-index: 1
          - justify-self: end
          - align-self: start
          - width: auto
          - max-width: 88px
          - min-width: 72px
          - flex-shrink: 0
          - padding: 6px 10px
          - border-radius: 12px
          - background: rgba(255,255,255,0.18)
          - font-size: 11px
          - font-weight: 600
          - letter-spacing: 0.5px
          - text-transform: uppercase
          - white-space: normal
          - overflow-wrap: anywhere
          - line-height: 1.35
          - text-align: right
    custom_fields:
      glow: |
        [[[
          const p = states['sensor.e3dc_maestro_regelphase'] ? states['sensor.e3dc_maestro_regelphase'].state : '';
          const low = states['binary_sensor.e3dc_maestro_akku_prioritat_aktiv'] && states['binary_sensor.e3dc_maestro_akku_prioritat_aktiv'].state === 'on';
          const iconmap = {
            off: 'power', manual: 'hand-back-right',
            emergency: 'alert-octagon', curtailment_guard: 'weather-sunny-alert',
            feed_in_limit: 'transmission-tower-off', force_discharge: 'battery-arrow-down',
            pv_delay: 'clock-alert-outline', astro_wait: 'weather-sunset-up',
            morning_cap: 'battery-clock-outline', morning_discharge: 'battery-arrow-down',
            hard_soc_limit: 'battery-lock', fast_floor: 'battery-charging-high',
            corridor: 'battery-charging', spreading: 'chart-bell-curve',
            reserve_protection: 'shield-half-full', evcc_pause: 'ev-plug-type2',
            ht_protection: 'clock-alert', grid_charge: 'transmission-tower-import',
            idle: 'pause-circle-outline', normal: 'auto-mode'
          };
          const name = low ? 'weather-cloudy-clock' : (iconmap[p] || 'state-machine');
          return `<ha-icon icon="mdi:${name}" style="--mdc-icon-size:48px;width:48px;height:48px;margin:0;"></ha-icon>`;
        ]]]
      title: |
        [[[
          const p = states['sensor.e3dc_maestro_regelphase'] ? states['sensor.e3dc_maestro_regelphase'].state : '—';
          const names = {
            off: 'Regelung aus', manual: 'Manuell',
            emergency: 'Notfall-Reserve', curtailment_guard: 'Abregelschutz',
            feed_in_limit: 'Einspeisedrosselung', force_discharge: 'Erzwungene Entladung',
            pv_delay: 'PV-Verzögerung', astro_wait: 'Astro-Wartezeit',
            morning_cap: 'Morning-Cap', morning_discharge: 'Morgen-Vorentladung',
            hard_soc_limit: 'Hard-SoC-Limit', fast_floor: 'Schnelllade-Boden',
            corridor: 'Lade-Korridor', spreading: 'Ladeverteilung',
            reserve_protection: 'Reserve-Schutz', ht_protection: 'HT-Schutz',
            grid_charge: 'Netzladung (günstig)',
            evcc_pause: 'EVCC-Pause', idle: 'Leerlauf', normal: 'Normalbetrieb'
          };
          return names[p] || p;
        ]]]
      subtitle: |
        [[[
          const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
          const exp = states['sensor.e3dc_maestro_entscheidungserklarung'];
          if (exp && ok(exp.state)) return exp.state;
          const a = states['sensor.e3dc_maestro_letzte_aktion'];
          if (a && a.attributes && ok(a.attributes.reason)) return a.attributes.reason;
          if (a && ok(a.state) && !/^[a-z_]+$/.test(a.state)) return a.state;
          return 'Noch keine Regelentscheidung verfügbar';
        ]]]
      forecast: |
        [[[
          const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
          const fmt = (v) => v.toFixed(1).replace('.', ',');
          const weak = states['binary_sensor.e3dc_maestro_schwacher_pv_tag'];
          const isWeak = weak && weak.state === 'on';
          const phase = states['sensor.e3dc_maestro_regelphase'];
          const p = phase ? phase.state : '';
          const socE = states['sensor.e3dc_maestro_aktueller_soc'];
          const soc = socE && ok(socE.state) ? parseFloat(socE.state) : NaN;
          const lowSoc = p === 'fast_floor' || (!isNaN(soc) && soc < 40);
          const def = states['sensor.e3dc_maestro_morgen_energiedefizit'];
          const deficit = def && ok(def.state) ? parseFloat(def.state) : NaN;
          const hasDeficit = !isNaN(deficit) && deficit >= 0.5;
          const fwd = states['sensor.e3dc_maestro_vorausschauendes_ladeziel'];
          const fwdTarget = fwd && ok(fwd.state) ? parseFloat(fwd.state) : NaN;
          const lines = [];

          // Heute: klar vom Morgen-Defizit trennen
          if (isWeak) {
            lines.push('<b>Heute:</b> Schwacher PV-Tag — Akku hat Vorrang.');
          } else if (hasDeficit || lowSoc) {
            lines.push(lowSoc
              ? '<b>Heute:</b> Kein PV-Engpass — Fokus ist der niedrige SoC.'
              : '<b>Heute:</b> Kein PV-Engpass.');
          }

          // Morgen: Energielücke (nicht mit 24h-Netzbezug verwechseln)
          if (hasDeficit) {
            let morgen = '<b>Morgen:</b> Schwachwetter → Lücke ~' + fmt(deficit) + ' kWh.';
            if (!isNaN(fwdTarget) && fwdTarget >= 90) {
              morgen += ' Maestro lädt deshalb heute voll vor.';
            } else if (!isNaN(fwdTarget) && fwdTarget > 0) {
              morgen += ' Maestro erhöht deshalb das heutige Ladeziel.';
            }
            lines.push(morgen);
          }

          return lines.length ? lines.join('<br>') : '';
        ]]]
      badge: |
        [[[
          const r = states['switch.e3dc_maestro_regelung_aktiv'];
          const e = states['binary_sensor.e3dc_maestro_e3dc_erreichbar'];
          if (!r || r.state !== 'on') return '⏸ Regelung<br>pausiert';
          if (!e || e.state !== 'on')  return '⚠ E3DC<br>offline';
          const t = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
          return '● Live<br>' + t;
        ]]]
    tap_action:
      action: more-info
      entity: sensor.e3dc_maestro_regelphase

  # ── SoC-Hero: Corner-Glow + Progress-Ring ums Icon (gleicher Stil) ───────
  soc_ring:
    template: base_card
    entity: sensor.e3dc_maestro_aktueller_soc
    name: Akkustand
    icon: mdi:battery-high
    show_state: false
    show_label: true
    show_icon: false
    variables:
      accent: "#43a047"
    label: |
      [[[
        const s = parseFloat(entity.state);
        return isNaN(s) ? '—' : Math.round(s) + ' %';
      ]]]
    styles:
      card:
        - height: 210px
        - padding: 16px 16px 12px 16px
      label:
        - font-size: 36px
        - font-weight: 800
        - letter-spacing: -0.8px
        - justify-self: start
        - z-index: 2
        - position: relative
        - color: |
            [[[
              const s = parseFloat(entity.state);
              if (isNaN(s)) return 'var(--primary-text-color)';
              return s < 25 ? '#e53935' : (s < 50 ? '#fb8c00' : '#43a047');
            ]]]
        - margin-top: 4px
      grid:
        - grid-template-areas: '"n n" "l l" "m m" "g ."'
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: auto auto auto 1fr
      custom_fields:
        meta:
          - grid-area: m
          - z-index: 2
          - position: relative
          - font-size: 12px
          - opacity: 0.7
          - justify-self: start
          - margin-top: 4px
          - padding-right: 8px
        glow:
          - grid-area: g
          - position: absolute
          - left: -4px
          - bottom: -6px
          - width: 124px
          - height: 124px
          - z-index: 0
          - pointer-events: none
          - display: grid
          - place-items: center
          - padding: 0 0 10px 10px
          - box-sizing: border-box
    custom_fields:
      meta: |
        [[[
          const t = states['sensor.e3dc_maestro_ziel_soc'];
          const tv = (t && !['unknown','unavailable',''].includes(t.state))
            ? Math.round(parseFloat(t.state)) : '—';
          const z = states['sensor.e3dc_maestro_autonomiezeit'];
          const zt = (z && !['unknown','unavailable',''].includes(z.state)) ? z.state : '—';
          return `Ziel ${tv} %  ·  Autonomie ${zt}`;
        ]]]
      glow: |
        [[[
          const socRaw = parseFloat(entity.state);
          const soc = isNaN(socRaw) ? 0 : Math.max(0, Math.min(100, socRaw));
          const deg = (soc / 100) * 360;
          const color = isNaN(socRaw) ? '#78909c' : (soc < 25 ? '#e53935' : (soc < 50 ? '#fb8c00' : '#43a047'));
          const icon = soc < 15 ? 'battery-outline' : (soc < 40 ? 'battery-40' : (soc < 70 ? 'battery-70' : 'battery'));
          return `
            <div style="
              width:112px;height:112px;border-radius:50%;
              display:grid;place-items:center;
              background:
                radial-gradient(circle at 50% 50%,
                  color-mix(in srgb, ${color} 48%, transparent) 0%,
                  color-mix(in srgb, ${color} 16%, transparent) 46%,
                  transparent 72%),
                conic-gradient(from -90deg, ${color} 0deg, ${color} ${deg}deg,
                  color-mix(in srgb, var(--primary-text-color) 10%, transparent) ${deg}deg 360deg);
            ">
              <div style="
                width:82px;height:82px;border-radius:50%;
                background: var(--card-background-color);
                display:grid;place-items:center;
              ">
                <ha-icon icon="mdi:${icon}" style="
                  --mdc-icon-size:40px;width:40px;height:40px;color:${color};margin:0;
                  filter: drop-shadow(0 2px 10px color-mix(in srgb, ${color} 45%, transparent));
                "></ha-icon>
              </div>
            </div>
          `;
        ]]]
    tap_action:
      action: more-info
      entity: sensor.e3dc_maestro_aktueller_soc

  # ── Money-Tile: Wert wird farbig (rot < 0, grün > 0) ─────────────────────
  money_tile:
    template: kpi
    variables:
      accent: "#78909c"
    state:
      - operator: template
        value: "[[[ return parseFloat(entity.state) > 0 ]]]"
        styles:
          label: [color: "#43a047"]
          icon: [color: "#43a047"]
          img_cell:
            - background: "radial-gradient(circle at 50% 50%, color-mix(in srgb, #43a047 55%, transparent) 0%, color-mix(in srgb, #43a047 22%, transparent) 42%, transparent 70%)"
      - operator: template
        value: "[[[ return parseFloat(entity.state) < 0 ]]]"
        styles:
          label: [color: "#e53935"]
          icon: [color: "#e53935"]
          img_cell:
            - background: "radial-gradient(circle at 50% 50%, color-mix(in srgb, #e53935 55%, transparent) 0%, color-mix(in srgb, #e53935 22%, transparent) 42%, transparent 70%)"
    label: |
      [[[
        const v = parseFloat(entity.state);
        if (isNaN(v)) return '—';
        return (v >= 0 ? '+' : '') + v.toFixed(2).replace('.', ',') + ' €';
      ]]]
    show_label: true
    show_state: false
    styles:
      label:
        - font-size: 22px
        - font-weight: 800
        - letter-spacing: -0.4px
        - justify-self: start
        - z-index: 2
        - position: relative
        - color: "[[[ return variables.accent ]]]"
        - margin-top: 2px
      grid:
        - grid-template-areas: '"n n" "l l" "i ."'

  # ── Action-Ticker: "Letzte Aktion" als News-Ticker + Mini-Historie ──────
  # Zeigt die aktuelle Regel-Aktion (Phase/Grund/Modus/Limits) groß an und
  # darunter – falls vorhanden – die letzten Phasen-/Grund-Wechsel aus
  # sensor.e3dc_maestro_letzte_aktion.attributes.history (max. 5 Zeilen).
  # Ohne Historie (z. B. direkt nach Neustart) wird nur die aktuelle Aktion
  # gezeigt, kein leerer Block.
  action_ticker:
    show_name: false
    show_state: false
    show_icon: false
    show_label: false
    entity: sensor.e3dc_maestro_letzte_aktion
    variables:
      accent: "var(--primary-color)"
    tap_action:
      action: more-info
      entity: sensor.e3dc_maestro_letzte_aktion
    styles:
      card:
        - border-radius: 22px
        - padding: 16px 18px 14px 18px
        - min-height: 220px
        - background: "linear-gradient(160deg, color-mix(in srgb, var(--card-background-color) 92%, #000) 0%, var(--card-background-color) 55%, color-mix(in srgb, var(--card-background-color) 88%, #000) 100%)"
        - box-shadow: 0 6px 18px rgba(0,0,0,0.18)
        - border: 1px solid color-mix(in srgb, var(--primary-text-color) 7%, transparent)
        - overflow: hidden
        - position: relative
      grid:
        # Volle Breite für Marquee + History; Icon liegt absolut oben links
        # und verbraucht keine Grid-Spalte mehr.
        - grid-template-areas: '"head time" "headline headline" "chips chips" "ticker ticker"'
        - grid-template-columns: 1fr auto
        - grid-template-rows: auto auto auto auto
        - row-gap: 8px
        - column-gap: 10px
        - align-items: start
      custom_fields:
        glow:
          # Overlay über dem gesamten Grid – keine eigene Spalte, volle Textbreite.
          - grid-area: "1 / 1 / -1 / -1"
          - position: absolute
          - left: -8px
          - top: -10px
          - width: 108px
          - height: 108px
          - border-radius: 50%
          - z-index: 0
          - pointer-events: none
          - display: grid
          - place-items: center
          - padding: 10px 0 0 10px
          - box-sizing: border-box
        head:
          - grid-area: head
          - position: relative
          - z-index: 2
          - font-size: 15px
          - font-weight: 700
          - letter-spacing: -0.2px
          # Nur die Titelzeile rückt vor dem Corner-Icon ein.
          - padding-left: 72px
          - padding-top: 4px
        time:
          - grid-area: time
          - position: relative
          - z-index: 2
          - justify-self: end
          - font-size: 11px
          - font-weight: 600
          - opacity: 0.65
          - white-space: nowrap
          - margin-top: 6px
        headline:
          - grid-area: headline
          - position: relative
          - z-index: 2
          - font-size: 13.5px
          - line-height: 1.4
          - opacity: 0.92
          - overflow: hidden
          - min-width: 0
          - width: 100%
          - min-height: 1.4em
        chips:
          - grid-area: chips
          - position: relative
          - z-index: 2
          - display: flex
          - flex-wrap: wrap
          - gap: 6px
        ticker:
          - grid-area: ticker
          - position: relative
          - z-index: 2
          - display: flex
          - flex-direction: column
          - gap: 5px
          - width: 100%
          - min-width: 0
    custom_fields:
      glow: |
        [[[
          const iconmap = {
            off: 'power', manual: 'hand-back-right', emergency: 'alert-octagon',
            curtailment_guard: 'weather-sunny-alert', feed_in_limit: 'transmission-tower-off',
            force_discharge: 'battery-arrow-down', pv_delay: 'clock-alert-outline',
            astro_wait: 'weather-sunset-up', morning_cap: 'battery-clock-outline',
            morning_discharge: 'battery-arrow-down', hard_soc_limit: 'battery-lock',
            fast_floor: 'battery-charging-high', corridor: 'battery-charging',
            spreading: 'chart-bell-curve', reserve_protection: 'shield-half-full',
            evcc_pause: 'ev-plug-type2', ht_protection: 'clock-alert',
            grid_charge: 'transmission-tower-import', idle: 'pause-circle-outline',
            normal: 'auto-mode'
          };
          const p = entity.state;
          const ok = p && !['unknown', 'unavailable', 'none', ''].includes(p);
          const icon = (ok && iconmap[p]) || 'history';
          const c = variables.accent || 'var(--primary-color)';
          return `<div style="
              width:100%;height:100%;border-radius:50%;
              display:grid;place-items:center;
              background: radial-gradient(circle at 50% 50%,
                color-mix(in srgb, ${c} 55%, transparent) 0%,
                color-mix(in srgb, ${c} 22%, transparent) 42%,
                transparent 70%);
            ">
              <ha-icon icon="mdi:${icon}" style="
                --mdc-icon-size:48px;width:48px;height:48px;color:${c};margin:0;
                filter: drop-shadow(0 2px 10px color-mix(in srgb, ${c} 45%, transparent));
              "></ha-icon>
            </div>`;
        ]]]
      head: |
        [[[
          const names = {
            off: 'Regelung aus', manual: 'Manuell', emergency: 'Notfall-Reserve',
            curtailment_guard: 'Abregelschutz', feed_in_limit: 'Einspeisedrosselung',
            force_discharge: 'Erzwungene Entladung', pv_delay: 'PV-Verzögerung',
            astro_wait: 'Astro-Wartezeit', morning_cap: 'Morning-Cap',
            morning_discharge: 'Morgen-Vorentladung', hard_soc_limit: 'Hard-SoC-Limit',
            fast_floor: 'Schnelllade-Boden', corridor: 'Lade-Korridor',
            spreading: 'Ladeverteilung', reserve_protection: 'Reserve-Schutz',
            ht_protection: 'HT-Schutz', grid_charge: 'Netzladung (günstig)',
            evcc_pause: 'EVCC-Pause', idle: 'Leerlauf', normal: 'Normalbetrieb'
          };
          const p = entity.state;
          const ok = p && !['unknown', 'unavailable', 'none', ''].includes(p);
          return ok ? (names[p] || p) : '—';
        ]]]
      time: |
        [[[
          const t = entity.attributes ? entity.attributes.timestamp_display : null;
          if (!t) return '—';
          return t.split(' ').pop();
        ]]]
      headline: |
        [[[
          const a = entity.attributes || {};
          const text = (a.reason && String(a.reason).trim().length)
            ? a.reason
            : 'Noch keine Regelentscheidung verfügbar';
          // Volle Kartenbreite: News-Ticker startet rechts außerhalb und
          // wandert langsam nach links (Anfang zuerst lesbar).
          if (text.length > 48) {
            const dur = Math.max(28, Math.min(50, Math.round(text.length * 0.55)));
            return `<div style="overflow:hidden;white-space:nowrap;width:100%;">
              <span style="display:inline-block;padding-left:100%;animation: maestro-ticker-scroll ${dur}s linear infinite;">${text}</span>
            </div>`;
          }
          return `<div>${text}</div>`;
        ]]]
      chips: |
        [[[
          const a = entity.attributes || {};
          const chip = (label, val) => (val === undefined || val === null || val === '') ? '' :
            `<span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:10px;font-size:10.5px;font-weight:600;background:color-mix(in srgb, var(--primary-text-color) 8%, transparent);opacity:0.85;white-space:nowrap;">${label} ${val}</span>`;
          return [
            chip('Modus', a.power_mode),
            chip('Soll', a.charge_power_limit != null ? a.charge_power_limit + ' W' : null),
            chip('Gesendet', a.sent_charge_power_limit != null ? a.sent_charge_power_limit + ' W' : null),
          ].join('');
        ]]]
      ticker: |
        [[[
          const names = {
            off: 'Regelung aus', manual: 'Manuell', emergency: 'Notfall-Reserve',
            curtailment_guard: 'Abregelschutz', feed_in_limit: 'Einspeisedrosselung',
            force_discharge: 'Erzwungene Entladung', pv_delay: 'PV-Verzögerung',
            astro_wait: 'Astro-Wartezeit', morning_cap: 'Morning-Cap',
            morning_discharge: 'Morgen-Vorentladung', hard_soc_limit: 'Hard-SoC-Limit',
            fast_floor: 'Schnelllade-Boden', corridor: 'Lade-Korridor',
            spreading: 'Ladeverteilung', reserve_protection: 'Reserve-Schutz',
            ht_protection: 'HT-Schutz', grid_charge: 'Netzladung (günstig)',
            evcc_pause: 'EVCC-Pause', idle: 'Leerlauf', normal: 'Normalbetrieb'
          };
          const hist = (entity.attributes && entity.attributes.history) || [];
          if (!hist.length) return '';
          return hist.slice(0, 5).map(h => {
            const label = names[h.phase] || h.phase || '—';
            const reason = h.reason || '';
            const time = (h.timestamp_display || '').split(' ').pop();
            // Volle Breite: kein hartes Truncate mehr – CSS ellipsis am Zeilenende.
            return `<div style="display:flex;align-items:baseline;gap:8px;font-size:11.5px;line-height:1.5;border-top:1px solid color-mix(in srgb, var(--primary-text-color) 8%, transparent);padding-top:4px;width:100%;min-width:0;">
              <span style="opacity:0.5;flex:none;white-space:nowrap;">${time}</span>
              <span style="font-weight:700;opacity:0.85;flex:none;white-space:nowrap;">${label}</span>
              <span style="opacity:0.6;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${reason}</span>
            </div>`;
          }).join('');
        ]]]
    extra_styles: |
      /* padding-left:100% = Start komplett rechts außerhalb der Karte,
         danach langsames Durchlaufen nach links (Anfang zuerst lesbar). */
      @keyframes maestro-ticker-scroll {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

views:

  # ========================================================================
  # TAB 1: ÜBERSICHT (button-card driven, modern UI)
  # ========================================================================
  - title: Übersicht
    icon: mdi:view-dashboard-variant
    path: uebersicht
    type: sections
    max_columns: 3
    sections:

      # ── Phase-Hero (volle Breite, JS-getrieben) ──────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: phase_hero

      # ── SoC-Ring + 3 KPI-Tiles ───────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Akkustand & Sollwerte
            icon: mdi:battery-heart-variant

          - type: custom:button-card
            template: soc_ring

      - type: grid
        cards:
          - type: heading
            heading: Sollwerte jetzt
            icon: mdi:target

          - type: custom:button-card
            template: kpi_enriched
            entity: sensor.e3dc_maestro_ziel_soc
            name: Ziel-SoC
            icon: mdi:battery-heart-variant
            variables:
              accent: "#43a047"
            tap_action:
              action: more-info
            custom_fields:
              meta: |
                [[[
                  const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                  const cur = states['sensor.e3dc_maestro_aktueller_soc'];
                  const tgt = entity;
                  const end = states['sensor.e3dc_maestro_saisonales_ladeende_uhrzeit'];
                  const c = cur && ok(cur.state) ? parseFloat(cur.state) : NaN;
                  const t = tgt && ok(tgt.state) ? parseFloat(tgt.state) : NaN;
                  let line = '—';
                  if (!isNaN(c) && !isNaN(t)) {
                    const d = Math.round(t - c);
                    line = (d > 0 ? '+' : '') + d + ' %';
                  }
                  if (end && ok(end.state)) line += ' · bis ' + end.state;
                  return line;
                ]]]
              chip:
                card:
                  type: custom:button-card
                  template: quick_chip
                  name: Ladeende
                  variables:
                    accent: "#43a047"
                  tap_action:
                    action: more-info
                    entity: number.e3dc_maestro_ladeende_soc

          - type: custom:button-card
            template: kpi_enriched
            entity: sensor.e3dc_maestro_ziel_ladeleistung
            name: Ziel-Ladeleistung
            icon: mdi:lightning-bolt
            variables:
              accent: "#f9a825"
            tap_action:
              action: more-info
            custom_fields:
              meta: |
                [[[
                  const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                  const phase = states['sensor.e3dc_maestro_regelphase'];
                  const lim = states['sensor.e3dc_maestro_soll_lade_limit'];
                  const max = states['number.e3dc_maestro_max_ladeleistung'];
                  const names = {
                    corridor: 'Korridor', spreading: 'Spreading', idle: 'Idle',
                    pv_delay: 'PV-Delay', grid_charge: 'Netzladung',
                    feed_in_limit: 'Einspeise', curtailment_guard: 'Abregel',
                    emergency: 'Notfall', hard_soc_limit: 'Hard-SoC',
                    force_discharge: 'Entladung', off: 'Aus'
                  };
                  const p = (phase && ok(phase.state)) ? (names[phase.state] || phase.state) : '—';
                  let cap = '';
                  if (lim && ok(lim.state)) {
                    const v = parseFloat(lim.state);
                    cap = !isNaN(v)
                      ? (Math.abs(v) >= 1000 ? (v/1000).toFixed(1).replace('.',',') + ' kW' : Math.round(v) + ' W')
                      : '';
                  } else if (max && ok(max.state)) {
                    const v = parseFloat(max.state);
                    cap = !isNaN(v)
                      ? 'max ' + (Math.abs(v) >= 1000 ? (v/1000).toFixed(1).replace('.',',') + ' kW' : Math.round(v) + ' W')
                      : '';
                  }
                  return cap ? (p + ' · ' + cap) : p;
                ]]]
              chip:
                card:
                  type: custom:button-card
                  template: quick_chip
                  entity: switch.e3dc_maestro_korridor_pause_min_ladeleistung
                  name: |
                    [[[
                      return entity && entity.state === 'on' ? 'Pause an' : 'Pause';
                    ]]]
                  variables:
                    accent: "#f9a825"
                  state:
                    - value: "on"
                      styles:
                        name:
                          - color: "#fb8c00"
                    - value: "off"
                      styles:
                        name:
                          - color: "#f9a825"
                  tap_action:
                    action: toggle
                  hold_action:
                    action: more-info

          - type: custom:button-card
            template: kpi_enriched
            entity: sensor.e3dc_maestro_autonomiezeit
            name: Autonomiezeit
            icon: mdi:timer-sand
            variables:
              accent: "#00acc1"
            tap_action:
              action: more-info
            custom_fields:
              meta: |
                [[[
                  const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                  const hp = states['sensor.e3dc_power_consumption_house'];
                  const res = states['sensor.e3dc_maestro_notstromreserve_aktuell'];
                  let line = 'Last —';
                  if (hp && ok(hp.state)) {
                    const v = parseFloat(hp.state);
                    if (!isNaN(v)) {
                      line = 'Last ' + (Math.abs(v) >= 1000
                        ? (v/1000).toFixed(1).replace('.',',') + ' kW'
                        : Math.round(v) + ' W');
                    }
                  }
                  if (res && ok(res.state)) {
                    const r = parseFloat(res.state);
                    if (!isNaN(r)) line += ' · Res ' + Math.round(r) + ' %';
                  }
                  return line;
                ]]]
              chip:
                card:
                  type: custom:button-card
                  template: quick_chip
                  name: Reserve
                  variables:
                    accent: "#00acc1"
                  tap_action:
                    action: more-info
                    entity: switch.e3dc_maestro_saisonale_notstromreserve
                  hold_action:
                    action: more-info
                    entity: sensor.e3dc_maestro_notstromreserve_aktuell

      # ── Energiefluss live (volle Breite) ─────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Energiefluss live
            icon: mdi:transmission-tower

          - type: custom:power-flow-card-plus
            entities:
              grid:
                entity: sensor.e3dc_grid_power
                invert_state: false
                color_icon: true
              solar:
                entity: sensor.e3dc_fronius_summe_solar_power
                color_icon: true
              battery:
                entity: sensor.e3dc_battery_power
                state_of_charge: sensor.e3dc_maestro_aktueller_soc
                color_icon: true
              home:
                entity: sensor.e3dc_power_consumption_house
                # Sonst summiert die Karte Quellen (Netz+Akku-Ladung → 18 kW-Fata Morgana)
                override_state: true
                color_icon: true
            clickable_entities: true
            display_zero_lines:
              mode: show
              transparency: 50
            kilo_decimals: 2
            min_flow_rate: 0.4
            max_flow_rate: 6
            kilo_threshold: 1000

      # ── Live-Leistungen (button-card, Vorzeichen → Farbe) ────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Live-Leistungen
            icon: mdi:flash

          - type: custom:button-card
            template: pv_tile
            entity: sensor.e3dc_fronius_summe_solar_power
            name: PV-Erzeugung
            icon: mdi:weather-sunny
            tap_action:
              action: more-info

          - type: custom:button-card
            template: house_tile
            entity: sensor.e3dc_power_consumption_house
            name: Hausverbrauch
            icon: mdi:home-lightning-bolt
            tap_action:
              action: more-info

          - type: custom:button-card
            template: power_tile
            entity: sensor.e3dc_grid_power
            name: Netz
            icon: mdi:transmission-tower
            tap_action:
              action: more-info

          - type: custom:button-card
            template: power_tile
            entity: sensor.e3dc_battery_power
            name: Akku
            icon: mdi:battery
            tap_action:
              action: more-info

      # ── Aktive Eingriffe (button-card Status-Chips, pulsieren wenn an) ─
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Aktive Eingriffe
            icon: mdi:shield-alert-outline

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_notfallladung_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_notfallladung_aktiv
              name: Notfall
              icon: mdi:alert-octagon
              variables:
                accent: "#c62828"
                styles:
                  card: [border: 1px solid "#c62828"]

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_abregelschutz_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_abregelschutz_aktiv
              name: Abregelschutz
              icon: mdi:weather-sunny-alert
              variables:
                accent: "#ef6c00"

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_einspeisedrosselung_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_einspeisedrosselung_aktiv
              name: Einspeisedrosselung
              icon: mdi:transmission-tower-off
              variables:
                accent: "#c62828"

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_ht_schutz_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_ht_schutz_aktiv
              name: HT-Schutz
              icon: mdi:clock-alert
              variables:
                accent: "#6a1b9a"

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_netzladung_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_netzladung_aktiv
              name: Netzladung
              icon: mdi:transmission-tower-import
              variables:
                accent: "#3949ab"

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_akku_prioritat_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_akku_prioritat_aktiv
              name: Akku-Priorität
              icon: mdi:weather-cloudy-clock
              variables:
                accent: "#fb8c00"
              tap_action:
                action: navigate
                navigation_path: /e3dc-maestro-modern/help-low-yield

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_ladesperre_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_ladesperre_aktiv
              name: Ladesperre
              icon: mdi:battery-lock
              variables:
                accent: "#c62828"

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_entladesperre_aktiv
                state: "on"
            card:
              type: custom:button-card
              template: status_chip
              entity: binary_sensor.e3dc_maestro_entladesperre_aktiv
              name: Entladesperre
              icon: mdi:battery-off-outline
              variables:
                accent: "#c62828"

          # Wenn KEIN Eingriff aktiv ist: zeige eine grüne „bereit"-Karte
          - type: custom:button-card
            entity: sensor.e3dc_maestro_regelphase
            template: status_chip
            name: Alles im grünen Bereich
            icon: mdi:check-circle-outline
            variables:
              accent: "#43a047"
            state:
              - operator: template
                value: |
                  [[[
                    return ['notfallladung_aktiv','abregelschutz_aktiv','einspeisedrosselung_aktiv',
                            'ht_schutz_aktiv','netzladung_aktiv','akku_prioritat_aktiv','ladesperre_aktiv','entladesperre_aktiv']
                      .some(k => states['binary_sensor.e3dc_maestro_' + k] &&
                                  states['binary_sensor.e3dc_maestro_' + k].state === 'on');
                  ]]]
                styles:
                  card: [display: none]

      # ── Schnellsteuerung (button-card Action-Tiles) ──────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Schnellsteuerung
            icon: mdi:tune

          - type: custom:button-card
            template: action_tile
            entity: switch.e3dc_maestro_regelung_aktiv
            name: Regelung aktiv
            icon: mdi:power
            custom_fields:
              meta: |
                [[[
                  const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                  const phase = states['sensor.e3dc_maestro_regelphase'];
                  const names = {
                    off: 'Aus', manual: 'Manuell', emergency: 'Notfall',
                    curtailment_guard: 'Abregelschutz', feed_in_limit: 'Einspeise',
                    force_discharge: 'Entladung', pv_delay: 'PV-Delay',
                    astro_wait: 'Astro', morning_cap: 'Morning-Cap',
                    morning_discharge: 'Vorentladung', hard_soc_limit: 'Hard-SoC',
                    fast_floor: 'Schnellboden', corridor: 'Korridor',
                    spreading: 'Spreading', reserve_protection: 'Reserve',
                    ht_protection: 'HT-Schutz', grid_charge: 'Netzladung',
                    evcc_pause: 'EVCC', idle: 'Idle', normal: 'Normal'
                  };
                  const p = (phase && ok(phase.state)) ? (names[phase.state] || phase.state) : '—';
                  return 'Phase · ' + p;
                ]]]
              chip:
                card:
                  type: custom:button-card
                  template: quick_chip
                  name: Warum?
                  variables:
                    accent: "var(--primary-color)"
                  tap_action:
                    action: more-info
                    entity: sensor.e3dc_maestro_entscheidungserklarung

          - type: custom:button-card
            template: action_tile
            entity: switch.e3dc_maestro_erzwungene_entladung
            name: Erzwungene Entladung
            icon: mdi:battery-arrow-down
            custom_fields:
              meta: |
                [[[
                  const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                  const n = states['number.e3dc_maestro_erzwungene_entladungsleistung'];
                  if (!(n && ok(n.state))) return 'Leistung —';
                  const v = parseFloat(n.state);
                  if (isNaN(v)) return 'Leistung —';
                  const p = Math.abs(v) >= 1000
                    ? (v/1000).toFixed(1).replace('.',',') + ' kW'
                    : Math.round(v) + ' W';
                  return 'Soll ' + p;
                ]]]
              chip:
                card:
                  type: custom:button-card
                  template: quick_chip
                  name: Leistung
                  variables:
                    accent: "#ef6c00"
                  tap_action:
                    action: more-info
                    entity: number.e3dc_maestro_erzwungene_entladungsleistung

          - type: custom:button-card
            template: action_tile
            entity: binary_sensor.e3dc_maestro_e3dc_erreichbar
            name: E3DC erreichbar
            icon: mdi:check-network
            tap_action:
              action: more-info
            custom_fields:
              meta: |
                [[[
                  const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                  const soc = states['sensor.e3dc_maestro_aktueller_soc'];
                  const lim = states['sensor.e3dc_maestro_soll_lade_limit'];
                  let line = 'SoC —';
                  if (soc && ok(soc.state)) {
                    const v = parseFloat(soc.state);
                    if (!isNaN(v)) line = 'SoC ' + Math.round(v) + ' %';
                  }
                  if (lim && ok(lim.state)) {
                    const v = parseFloat(lim.state);
                    if (!isNaN(v)) {
                      const p = Math.abs(v) >= 1000
                        ? (v/1000).toFixed(1).replace('.',',') + ' kW'
                        : Math.round(v) + ' W';
                      line += ' · Cap ' + p;
                    }
                  }
                  return line;
                ]]]
              chip:
                card:
                  type: custom:button-card
                  template: quick_chip
                  name: Phase
                  variables:
                    accent: "#00897b"
                  tap_action:
                    action: more-info
                    entity: sensor.e3dc_maestro_regelphase

          - type: custom:button-card
            template: action_tile
            entity: button.e3dc_maestro_manuell_laden_3_kwh
            name: Manuell 3 kWh laden
            icon: mdi:battery-plus
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.e3dc_maestro_manuell_laden_3_kwh
            custom_fields:
              meta: |
                [[[
                  const ok = (s) => s && !['unknown','unavailable','none',''].includes(s);
                  const cur = states['sensor.e3dc_maestro_aktueller_soc'];
                  const tgt = states['sensor.e3dc_maestro_ziel_soc'];
                  const c = cur && ok(cur.state) ? parseFloat(cur.state) : NaN;
                  const t = tgt && ok(tgt.state) ? parseFloat(tgt.state) : NaN;
                  if (isNaN(c)) return 'SoC —';
                  let line = 'Ist ' + Math.round(c) + ' %';
                  if (!isNaN(t)) {
                    const d = Math.round(t - c);
                    line += ' · Ziel ' + (d > 0 ? '+' : '') + d + ' %';
                  }
                  return line;
                ]]]
              chip:
                card:
                  type: custom:button-card
                  template: quick_chip
                  name: Freigeben
                  variables:
                    accent: "#43a047"
                  tap_action:
                    action: perform-action
                    perform_action: button.press
                    target:
                      entity_id: button.e3dc_maestro_limits_jetzt_freigeben
                  hold_action:
                    action: more-info
                    entity: button.e3dc_maestro_limits_jetzt_freigeben

      # ── SoC-Verlauf 24 h ─────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: SoC – 24 h
            icon: mdi:battery-charging-60

          - type: custom:mini-graph-card
            name: Ist vs. Ziel
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            animate: true
            show:
              labels: true
              extrema: true
              fill: fade
            entities:
              - entity: sensor.e3dc_maestro_aktueller_soc
                name: Ist-SoC
                color: var(--success-color)
              - entity: sensor.e3dc_maestro_ziel_soc
                name: Ziel-SoC
                color: var(--info-color)
                show_line: true
                show_fill: false

      # ── Leistungs-Mini-Graph 24 h ────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Leistungen – 24 h
            icon: mdi:flash

          - type: custom:mini-graph-card
            name: PV / Haus / Netz / Akku
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            smoothing: true
            animate: true
            show:
              labels: true
              legend: true
              fill: fade
            entities:
              - entity: sensor.e3dc_fronius_summe_solar_power
                name: PV
                color: "#f9a825"
              - entity: sensor.e3dc_power_consumption_house
                name: Haus
                color: "#6d4c41"
              - entity: sensor.e3dc_grid_power
                name: Netz
                color: "#1976d2"
              - entity: sensor.e3dc_battery_power
                name: Akku
                color: "#2e7d32"

      # ── Leistungen: Verlauf + Prognose (letzte/nächste 24 h) (ApexCharts) ────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Leistungen & SoC – Verlauf und Prognose
            icon: mdi:chart-timeline-variant

          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set src = state_attr('sensor.e3dc_maestro_forecast_datenqualitat', 'forecast_pv_source') %}
              **Prognose-Basis:**
              {% if src == 'day_forecast' -%}
              PV aus Tagesprognose (Solcast / Forecast.Solar), Verbrauch aus
              dem Durchschnittsprofil, angepasst an die aktuelle Last (klingt
              innerhalb weniger Stunden ab).
              {%- else -%}
              PV und Verbrauch sind **Durchschnittswerte der letzten Tage**
              („typischer Tag"), keine Vorhersage für heute.
              {%- endif %}
              Kurven sind Modellwerte; Abweichungen durch Wetter oder große
              Verbraucher (z. B. Wallbox, Heizstab) sind möglich.

          - type: vertical-stack
            grid_options:
              columns: full
            cards:
              - type: custom:apexcharts-card
                chart_type: line
                graph_span: 48h
                span:
                  end: minute
                  offset: +24h
                now:
                  show: true
                  label: Jetzt
                header:
                  show: true
                  title: Verlauf 24 h (—) und Prognose 24 h (···)
                all_series_config:
                  stroke_width: 3
                  curve: smooth
                  show:
                    legend_value: false
                yaxis:
                  # Feste Leistungsskala in W. An die eigene Anlage anpassen.
                  # SoC-min so wählen, dass 0 W und 0 % auf einer Linie liegen:
                  #   soc_min = -power_min / (power_max - power_min) * 100
                  - id: power
                    min: -4000
                    max: 16000
                    decimals: 0
                    apex_config:
                      forceNiceScale: false
                      tickAmount: 5
                      labels:
                        style:
                          colors: "#eceff1"
                  - id: soc
                    opposite: true
                    min: -25
                    max: 100
                    decimals: 0
                    apex_config:
                      forceNiceScale: false
                      tickAmount: 5
                      labels:
                        style:
                          colors: "#e040fb"
                        formatter: |
                          EVAL:function (val) { return val < 0 ? '' : val; }
                apex_config:
                  chart:
                    height: 320
                    events:
                      legendClick: |
                        EVAL:function (ctx, i) { var n = ctx.w.globals.seriesNames; var j = (i + 5) % 10; if (n[j]) ctx.toggleSeries(n[j]); }
                  xaxis:
                    type: datetime
                    labels:
                      datetimeUTC: false
                      format: HH:mm
                      style:
                        colors: "#eceff1"
                  legend:
                    show: true
                    labels:
                      colors: "#eceff1"
                  tooltip:
                    theme: dark
                  grid:
                    borderColor: "#78909c"
                series:
                  # Ist-Verlauf
                  - entity: sensor.e3dc_maestro_aktueller_soc
                    name: SoC
                    yaxis_id: soc
                    color: "#e040fb"
                    group_by: { func: avg, duration: 15min }
                    extend_to: now
                  - entity: sensor.e3dc_fronius_summe_solar_power
                    name: PV
                    yaxis_id: power
                    color: "#ffeb3b"
                    group_by: { func: avg, duration: 15min }
                    extend_to: now
                  - entity: sensor.e3dc_power_consumption_house
                    name: Haus
                    yaxis_id: power
                    color: "#a1887f"
                    group_by: { func: avg, duration: 15min }
                    extend_to: now
                  - entity: sensor.e3dc_grid_power
                    name: Netz
                    yaxis_id: power
                    color: "#42a5f5"
                    group_by: { func: avg, duration: 15min }
                    extend_to: now
                  - entity: sensor.e3dc_battery_power
                    name: Akku
                    yaxis_id: power
                    color: "#66bb6a"
                    group_by: { func: avg, duration: 15min }
                    extend_to: now
                  # Prognose (aus Maestro-Simulation)
                  - entity: sensor.e3dc_maestro_forecast_soc_trajektorie_24h
                    name: SoC Prognose
                    yaxis_id: soc
                    color: "#e040fb"
                    stroke_dash: 2
                    show: { in_header: false, in_legend: false }
                    data_generator: |
                      return entity.attributes.trajectory_points || [];
                  - entity: sensor.e3dc_maestro_forecast_soc_trajektorie_24h
                    name: PV Prognose
                    yaxis_id: power
                    color: "#ffeb3b"
                    stroke_dash: 2
                    show: { in_header: false, in_legend: false }
                    data_generator: |
                      return entity.attributes.pv_points || [];
                  - entity: sensor.e3dc_maestro_forecast_soc_trajektorie_24h
                    name: Haus Prognose
                    yaxis_id: power
                    color: "#a1887f"
                    stroke_dash: 2
                    show: { in_header: false, in_legend: false }
                    data_generator: |
                      return entity.attributes.house_points || [];
                  - entity: sensor.e3dc_maestro_forecast_soc_trajektorie_24h
                    name: Netz Prognose
                    yaxis_id: power
                    color: "#42a5f5"
                    stroke_dash: 2
                    show: { in_header: false, in_legend: false }
                    # Chart: Einspeisung nach unten (−), Bezug nach oben — wie typische E3DC-Sensoren.
                    # Sensor-Attribute bleiben Maestro-Konvention (+ = Einspeisung).
                    data_generator: |
                      return (entity.attributes.grid_points || []).map(function (p) { return [p[0], -p[1]]; });
                  - entity: sensor.e3dc_maestro_forecast_soc_trajektorie_24h
                    name: Akku Prognose
                    yaxis_id: power
                    color: "#66bb6a"
                    stroke_dash: 2
                    show: { in_header: false, in_legend: false }
                    data_generator: |
                      return entity.attributes.battery_points || [];

          # ── Tagesstatistik (button-card KPIs + Mini-Graph) ───────────────

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Tagesstatistik
            icon: mdi:chart-box-outline

          - type: custom:button-card
            template: kpi
            entity: sensor.e3dc_maestro_geladen_heute
            name: Geladen heute
            icon: mdi:battery-plus
            variables:
              accent: "#43a047"

          - type: custom:button-card
            template: kpi
            entity: sensor.e3dc_maestro_entladen_heute
            name: Entladen heute
            icon: mdi:battery-minus
            variables:
              accent: "#ef6c00"

          - type: custom:button-card
            template: kpi
            entity: sensor.e3dc_maestro_abregelung_verhindert_heute
            name: Einspeiselimit gesichert
            icon: mdi:shield-check
            variables:
              accent: "#00897b"

          - type: custom:button-card
            template: kpi
            entity: sensor.e3dc_maestro_einspeise_eingriffe_heute
            name: Einspeise-Eingriffe
            icon: mdi:transmission-tower
            variables:
              accent: "#3949ab"

          - type: custom:mini-graph-card
            name: Geladen / Entladen heute
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            show:
              labels: true
              legend: true
              fill: fade
            entities:
              - entity: sensor.e3dc_maestro_geladen_heute
                name: Geladen
                color: "#2e7d32"
              - entity: sensor.e3dc_maestro_entladen_heute
                name: Entladen
                color: "#ef6c00"

      # ── Erträge & Kosten heute (button-card Money-Tiles + Details) ───
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Erträge & Kosten heute
            icon: mdi:currency-eur

          - type: custom:button-card
            template: money_tile
            entity: sensor.e3dc_maestro_pv_ersparnis_heute
            name: PV-Ersparnis
            icon: mdi:cash-plus

          - type: custom:button-card
            template: money_tile
            entity: sensor.e3dc_maestro_einspeise_erlos_heute
            name: Einspeise-Erlös
            icon: mdi:transmission-tower-export

          - type: custom:button-card
            template: money_tile
            entity: sensor.e3dc_maestro_stromkosten_heute
            name: Netzbezugskosten
            icon: mdi:cash-minus
            label: |
              [[[
                const v = parseFloat(entity.state);
                if (isNaN(v)) return '—';
                return '−' + Math.abs(v).toFixed(2).replace('.', ',') + ' €';
              ]]]
            styles:
              label: [color: "#c62828"]

          - type: custom:button-card
            template: money_tile
            entity: sensor.e3dc_maestro_energiebilanz_heute
            name: Bilanz heute
            icon: mdi:scale-balance
            styles:
              card:
                - background: |
                    [[[
                      const v = parseFloat(entity.state);
                      if (isNaN(v)) return 'var(--card-background-color)';
                      const a = v >= 0 ? '#43a047' : '#c62828';
                      return `linear-gradient(135deg, color-mix(in srgb, ${a} 18%, var(--card-background-color)) 0%, var(--card-background-color) 100%)`;
                    ]]]

          - type: entities
            state_color: true
            entities:
              - entity: sensor.e3dc_maestro_pv_eigenverbrauch_heute
                name: PV-Eigenverbrauch
              - entity: sensor.e3dc_maestro_netto_stromkosten_heute
                name: Netto-Stromkosten (Kosten − Erlös)
              - type: divider
              - entity: sensor.e3dc_maestro_netzbezug_heute
                name: Netzbezug (kWh)
              - entity: sensor.e3dc_maestro_netzeinspeisung_heute
                name: Netzeinspeisung (kWh)
              - entity: binary_sensor.e3dc_maestro_netzladung_ohne_rechtfertigung
                name: Netzladung ohne Rechtfertigung
              - type: divider
              - type: button
                name: Wie wird das berechnet?
                icon: mdi:help-circle-outline
                action_name: Hilfe öffnen
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-kostenmodul

      # ── Morgen-Prognose (button-card KPIs) ───────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Morgen-Prognose
            icon: mdi:weather-sunny

          - type: custom:button-card
            template: kpi
            entity: sensor.e3dc_maestro_vorausschauendes_ladeziel
            name: Ladeziel morgen
            icon: mdi:battery-charging-high
            variables:
              accent: "#43a047"

          - type: custom:button-card
            template: kpi
            entity: sensor.e3dc_maestro_morgen_pv_prognose
            name: PV morgen
            icon: mdi:weather-sunny
            variables:
              accent: "#f9a825"

          - type: custom:button-card
            template: kpi
            entity: sensor.e3dc_maestro_morgen_energiedefizit
            name: Defizit morgen
            icon: mdi:transmission-tower-import
            variables:
              accent: "#c62828"

      # ── Letzte Aktion (News-Ticker: aktuelle Aktion + Mini-Historie) ────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Letzte Aktion
            icon: mdi:history

          - type: custom:button-card
            template: action_ticker
            variables:
              accent: "#5c6bc0"

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.e3dc_maestro_regelphase
                state: pv_delay
            card:
              type: custom:button-card
              template: kpi
              entity: sensor.e3dc_maestro_verzogerter_ladestart_heute
              name: Verzögerter Ladestart
              icon: mdi:clock-alert-outline
              variables:
                accent: "#9ccc65"
              tap_action:
                action: navigate
                navigation_path: /e3dc-maestro-modern/help-pv-delay


  # ========================================================================
  # TAB 2: COCKPIT
  # ========================================================================
  - title: Cockpit
    icon: mdi:gauge
    path: cockpit
    type: sections
    max_columns: 3
    sections:

      # ── Hero-Karte mit Regelphase und Begründung ─────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Regelungs-Cockpit
            icon: mdi:gauge

          - type: markdown
            content: |
              {% set p = states('sensor.e3dc_maestro_regelphase') %}
              {% set names = {
                'off': 'Regelung aus',
                'manual': 'Manuell',
                'emergency': 'Notfall-Reserve',
                'curtailment_guard': 'Abregelschutz',
                'feed_in_limit': 'Einspeisedrosselung',
                'force_discharge': 'Erzwungene Entladung',
                'pv_delay': 'PV-Verzögerung',
                'astro_wait': 'Astro-Wartezeit',
                'morning_cap': 'Morning-Cap',
                'morning_discharge': 'Morgen-Vorentladung',
                'hard_soc_limit': 'Hard-SoC-Limit',
                'fast_floor': 'Schnelllade-Boden',
                'corridor': 'Lade-Korridor',
                'spreading': 'Ladeverteilung',
                'reserve_protection': 'Reserve-Schutz',
                'ht_protection': 'HT-Schutz',
                'grid_charge': 'Netzladung (günstig)',
                'evcc_pause': 'EVCC-Pause',
                'idle': 'Leerlauf',
                'normal': 'Normalbetrieb'
              } %}
              {% set weak_day = is_state('binary_sensor.e3dc_maestro_schwacher_pv_tag', 'on') %}
              {% set priority = is_state('binary_sensor.e3dc_maestro_akku_prioritat_aktiv', 'on') %}
              {% set q = (states('sensor.e3dc_maestro_pv_tag_quote') | float(0) * 100) | round(0) %}

              ## {{ names.get(p, p) | default('—') }}

              {{ states('sensor.e3dc_maestro_entscheidungserklarung') }}

              {% if priority %}

              ⚠️ **Akku-Priorität aktiv** ({{ q }} % vom Referenztag) — Akku-Ladung
              priorisiert, Spreading & Korridor-Pause pausiert, bis die Restprognose
              den Bedarf bis zum Ladeende-SoC deckt.
              {% elif weak_day %}

              ℹ️ Heute als PV-schwacher Tag erkannt ({{ q }} % vom Referenztag) —
              Restprognose deckt den Bedarf aktuell aber ausreichend, keine
              Akku-Priorität nötig.
              {% endif %}

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.e3dc_maestro_schwacher_pv_tag
                state: "on"
            card:
              type: tile
              entity: binary_sensor.e3dc_maestro_schwacher_pv_tag
              name: Schwacher PV-Tag – Hilfe öffnen
              icon: mdi:weather-cloudy-clock
              color: orange
              tap_action:
                action: navigate
                navigation_path: /e3dc-maestro-modern/help-low-yield

      # ── Gauges: Ziel-SoC & Ziel-Ladeleistung ─────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Sollwerte
            icon: mdi:target

          - type: gauge
            entity: sensor.e3dc_maestro_ziel_soc
            name: Ziel-SoC
            min: 0
            max: 100
            needle: true
            severity:
              green: 70
              yellow: 40
              red: 0

          - type: gauge
            entity: sensor.e3dc_maestro_ziel_ladeleistung
            name: Ziel-Ladeleistung
            unit: W
            min: 0
            max: 9000
            needle: true
            severity:
              green: 1000
              yellow: 300
              red: 0

      # ── Live-Leistungen (Mini-Graph) ─────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live-Leistungen
            icon: mdi:chart-line

          - type: custom:mini-graph-card
            name: PV / Haus / Netz / Akku – 12 h
            hours_to_show: 12
            points_per_hour: 12
            line_width: 2
            smoothing: true
            animate: true
            show:
              labels: true
              legend: true
              fill: fade
              extrema: false
            entities:
              - entity: sensor.e3dc_fronius_summe_solar_power
                name: PV
                color: "#f9a825"
              - entity: sensor.e3dc_power_consumption_house
                name: Haus
                color: "#6d4c41"
              - entity: sensor.e3dc_grid_power
                name: Netz
                color: "#1976d2"
              - entity: sensor.e3dc_battery_power
                name: Akku
                color: "#2e7d32"

      # ── Soll vs. Gesendet (E3DC-Drift) ───────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Soll vs. Gesendet (E3DC)
            icon: mdi:swap-horizontal

          - type: tile
            entity: sensor.e3dc_maestro_soll_lade_limit
            name: Soll-Lade-Limit
            icon: mdi:battery-lock
            color: blue

          - type: tile
            entity: sensor.e3dc_maestro_gesendetes_lade_limit
            name: Gesendetes Lade-Limit
            icon: mdi:battery-arrow-up
            color: green

          - type: tile
            entity: sensor.e3dc_maestro_soll_entlade_limit
            name: Soll-Entlade-Limit
            icon: mdi:battery-off-outline
            color: amber

          - type: tile
            entity: sensor.e3dc_maestro_gesendetes_entlade_limit
            name: Gesendetes Entlade-Limit
            icon: mdi:battery-arrow-down
            color: deep-orange

          - type: markdown
            content: >-
              {% set s1 = states('sensor.e3dc_maestro_soll_lade_limit') | float(0) %}
              {% set s2 = states('sensor.e3dc_maestro_gesendetes_lade_limit') | float(0) %}
              {% set d1 = states('sensor.e3dc_maestro_soll_entlade_limit') | float(0) %}
              {% set d2 = states('sensor.e3dc_maestro_gesendetes_entlade_limit') | float(0) %}
              {% set drift_c = (s1 - s2) | abs %}
              {% set drift_d = (d1 - d2) | abs %}
              {% if drift_c > 50 or drift_d > 50 %}
              ⚠️ **Drift erkannt** — Soll und Gesendet weichen auseinander
              (Lade Δ {{ drift_c | round(0) }} W, Entlade Δ {{ drift_d | round(0) }} W).
              [→ Hilfe Steuerverhalten](/e3dc-maestro-modern/help-steuerverhalten)
              {% else %}
              ✅ Lade-/Entlade-Limits sind synchron (Δ ≤ 50 W).
              {% endif %}

      # ── Live-Tuning: PV-Verzögerung ──────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Live-Tuning · PV-Verzögerung
            icon: mdi:clock-alert-outline

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_vorausschauende_ladung
                name: Vorausschauende Ladung aktiv
              - entity: switch.e3dc_maestro_pv_prognose_verzogerung
                name: PV-Prognose-Verzögerung aktiv
              - entity: number.e3dc_maestro_mindest_soc_vor_verzogerung
                name: Mindest-SoC vor Verzögerung
              - entity: number.e3dc_maestro_pv_forecast_schwelle
                name: PV-Forecast Schwelle
              - entity: number.e3dc_maestro_pv_forecast_sicherheitsfaktor
                name: PV-Forecast Sicherheitsfaktor
              - type: button
                name: "Hilfe zu diesem Abschnitt"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-pv-delay

      # ── Live-Tuning: Schwacher-PV-Tag ────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Live-Tuning · Schwacher-PV-Tag
            icon: mdi:weather-cloudy-clock

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_schwacher_pv_tag_prioritat
                name: Feature aktiviert (Einstellung)
              - entity: binary_sensor.e3dc_maestro_schwacher_pv_tag
                name: Heute als PV-schwach erkannt (Ganztags-Flag)
              - entity: binary_sensor.e3dc_maestro_akku_prioritat_aktiv
                name: Akku-Priorität aktuell aktiv (Bedarfsgate)
              - entity: sensor.e3dc_maestro_pv_tagesprognose
                name: PV-Tagesprognose
              - entity: sensor.e3dc_maestro_pv_referenz_ertrag
                name: PV-Referenz-Ertrag
              - entity: sensor.e3dc_maestro_pv_tag_quote
                name: PV-Tag Quote
              - entity: number.e3dc_maestro_schwacher_pv_tag_schwelle
                name: Schwelle (Anteil 0–1)
              - entity: number.e3dc_maestro_pv_referenz_manuell_0_automatisch
                name: PV-Referenz manuell (0 = auto)
              - entity: number.e3dc_maestro_pv_referenz_faktor_kwh_kwp
                name: PV-Referenz Faktor (kWh/kWp)
              - type: button
                name: "Hilfe zu diesem Abschnitt"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-low-yield

      # ── Live-Tuning: Astro / Morning-Cap ─────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Live-Tuning · Astro & Morning-Cap
            icon: mdi:weather-sunset-up

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_astro_modus_sonnenuberwachung
                name: Astro-Modus aktiv
              - entity: number.e3dc_maestro_ladestart_offset_nach_sonnenaufgang
                name: Ladestart Offset nach Sonnenaufgang (h)
              - entity: number.e3dc_maestro_ladeende_offset_zu_sonnenuntergang
                name: Ladeende Offset zu Sonnenuntergang (h)
              - type: divider
              - entity: switch.e3dc_maestro_morning_cap_soc_deckel_morgens
                name: Morning-Cap aktiv
              - entity: number.e3dc_maestro_morning_cap_soc_grenze
                name: Morning-Cap SoC-Grenze (%)
              - entity: number.e3dc_maestro_morning_cap_aktiv_bis_uhr_lokal
                name: Morning-Cap bis Uhr (lokal)
              - type: button
                name: "Hilfe Astro"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-astro
              - type: button
                name: "Hilfe Morning-Cap"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-flat-curve

      # ── Phasenverlauf 24 h ───────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Phasenverlauf 24 h
            icon: mdi:chart-timeline

          - type: history-graph
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.e3dc_maestro_regelphase
                name: Phase
              - entity: sensor.e3dc_maestro_letzte_aktion
                name: Aktion
              - entity: binary_sensor.e3dc_maestro_schwacher_pv_tag
                name: Schwacher PV-Tag (Ganztags-Flag)
              - entity: binary_sensor.e3dc_maestro_akku_prioritat_aktiv
                name: Akku-Priorität aktiv (Gate)

  # ========================================================================
  # TAB 3: LADEN (Ladestrategie & Optimierung)
  # ========================================================================
  - title: Laden
    icon: mdi:battery-charging-outline
    path: laden
    type: sections
    max_columns: 3
    sections:

      # ── Status-Übersicht aktiver Strategien ──────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Aktive Ladestrategien
            icon: mdi:strategy

          - type: tile
            entity: switch.e3dc_maestro_abregelschutz
            name: Abregelschutz
            icon: mdi:shield
            color: amber
            tap_action:
              action: toggle

          - type: tile
            entity: switch.e3dc_maestro_ladeverteilung_spreading
            name: Spreading
            icon: mdi:chart-timeline-variant
            color: teal
            tap_action:
              action: toggle

          - type: tile
            entity: switch.e3dc_maestro_schwacher_pv_tag_prioritat
            name: Schwacher-PV-Tag
            icon: mdi:weather-cloudy-clock
            color: orange
            tap_action:
              action: toggle

          - type: tile
            entity: switch.e3dc_maestro_korridor_pause_min_ladeleistung
            name: Korridor-Pause
            icon: mdi:pause-circle
            color: blue
            tap_action:
              action: toggle

          - type: tile
            entity: switch.e3dc_maestro_spat_ladung_two_tier
            name: Two-Tier (Spät-Ladung)
            icon: mdi:sort-clock-descending
            color: purple
            tap_action:
              action: toggle

          - type: tile
            entity: switch.e3dc_maestro_saisonale_notstromreserve
            name: Notstromreserve
            icon: mdi:battery-heart
            color: green
            tap_action:
              action: toggle

      # ── Geladen/Entladen Verlauf ─────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Lade-/Entlade-Verlauf
            icon: mdi:chart-areaspline

          - type: custom:mini-graph-card
            name: Lade-/Entlade-Energie heute
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            show:
              labels: true
              legend: true
              fill: fade
              extrema: true
            entities:
              - entity: sensor.e3dc_maestro_geladen_heute
                name: Geladen
                color: "#2e7d32"
              - entity: sensor.e3dc_maestro_entladen_heute
                name: Entladen
                color: "#ef6c00"
              - entity: sensor.e3dc_maestro_abregelung_verhindert_heute
                name: Einspeiselimit gesichert
                color: "#00897b"

      # ── Ladekorridor ─────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Ladekorridor
            icon: mdi:battery-charging

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_hard_soc_limit_akku_deckel
                name: Hard-SoC-Limit (Akku-Deckel) aktiv
              - entity: number.e3dc_maestro_hard_soc_limit_akku_deckel
                name: Hard-SoC-Limit (%)
              - entity: switch.e3dc_maestro_erweiterter_ladekorridor
                name: Erweiterter Ladekorridor (SoC-Delta → Leistung)
              - entity: number.e3dc_maestro_unterer_ladekorridor
                name: Unterer Ladekorridor (W)
              - entity: number.e3dc_maestro_oberer_ladekorridor
                name: Oberer Ladekorridor (W)
              - entity: switch.e3dc_maestro_schnelllade_boden
                name: Schnelllade-Boden aktiv
              - entity: number.e3dc_maestro_schnelllade_boden_soc
                name: Schnelllade-Boden SoC (%)
              - entity: number.e3dc_maestro_ladeschwelle
                name: Ladeschwelle / Notfall (%)
              - entity: number.e3dc_maestro_ladeende_soc
                name: Ladeende SoC (%)
              - entity: number.e3dc_maestro_ladeende_winter
                name: Ladeende Winter (Stunde, lokal) — nur ohne Astro
              - entity: number.e3dc_maestro_ladeende_sommer
                name: Ladeende Sommer (Stunde, lokal) — nur ohne Astro
              - entity: number.e3dc_maestro_sommerladeende_ziel
                name: Ziel-Ladeende Sommer (Stunde, lokal)
              - type: button
                name: "Hilfe Ladekorridor"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-ladekorridor

      # ── Spreading ────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Ladeverteilung (Spreading)
            icon: mdi:chart-timeline-variant

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_ladeverteilung_spreading
                name: Spreading aktiv
              - entity: number.e3dc_maestro_spreading_ziel_soc
                name: Spreading-Ziel SoC (%)
              - type: button
                name: "Hilfe Spreading"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-spreading

      # ── Schwacher-PV-Tag ─────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Schwacher-PV-Tag (Akku-Priorität)
            icon: mdi:weather-cloudy-clock

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_schwacher_pv_tag_prioritat
                name: Feature aktiviert (Einstellung)
              - entity: binary_sensor.e3dc_maestro_schwacher_pv_tag
                name: Heute als PV-schwach erkannt (Ganztags-Flag)
              - entity: binary_sensor.e3dc_maestro_akku_prioritat_aktiv
                name: Akku-Priorität aktuell aktiv (Bedarfsgate)
              - entity: sensor.e3dc_maestro_pv_tagesprognose
                name: PV-Tagesprognose
              - entity: sensor.e3dc_maestro_pv_referenz_ertrag
                name: PV-Referenz-Ertrag
              - entity: sensor.e3dc_maestro_pv_tag_quote
                name: PV-Tag Quote
              - entity: number.e3dc_maestro_schwacher_pv_tag_schwelle
                name: Schwelle (Anteil 0–1)
              - entity: number.e3dc_maestro_pv_referenz_manuell_0_automatisch
                name: PV-Referenz manuell (0 = auto)
              - entity: number.e3dc_maestro_pv_referenz_faktor_kwh_kwp
                name: PV-Referenz Faktor (kWh/kWp)
              - type: button
                name: "Hilfe Schwacher-PV-Tag"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-low-yield

      # ── Abregelschutz ────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Abregelschutz (Curtailment Guard)
            icon: mdi:shield-alert

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_abregelschutz
                name: Abregelschutz aktiv
              - entity: binary_sensor.e3dc_maestro_abregelschutz_aktiv
                name: Aktuell aktiv
              - entity: number.e3dc_maestro_abregelschutz_einschaltschwelle
                name: Einschaltschwelle (W)
              - entity: number.e3dc_maestro_abregelschutz_ausschaltschwelle
                name: Ausschaltschwelle (W)
              - type: button
                name: "Hilfe Abregelschutz"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-curtailment

      # ── Spät-Ladung (Two-Tier) ───────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Spät-Ladung (Two-Tier)
            icon: mdi:sort-clock-descending

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_spat_ladung_two_tier
                name: Spät-Ladung aktiv
              - entity: number.e3dc_maestro_spatziel_soc
                name: Spätziel SoC (%)
              - entity: number.e3dc_maestro_spat_ladeende_stunde
                name: Spät-Ladeende (Stunde, lokal)
              - type: button
                name: "Hilfe Two-Tier"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-two-tier

      # ── Manuelles Laden / Reset ──────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Manuelle Aktionen
            icon: mdi:hand-pointing-up

          - type: entities
            entities:
              - entity: button.e3dc_maestro_manuell_laden_3_kwh
                name: Manuell 3 kWh laden
              - entity: button.e3dc_maestro_limits_jetzt_freigeben
                name: Limits jetzt freigeben
              - entity: button.e3dc_maestro_statistik_zurucksetzen
                name: Statistik zurücksetzen
              - entity: switch.e3dc_maestro_erzwungene_entladung
                name: Erzwungene Entladung
              - entity: number.e3dc_maestro_erzwungene_entladungsleistung
                name: Erzwungene Entladungsleistung (W)

  # ========================================================================
  # TAB 4: ZEITPLANUNG
  # ========================================================================
  - title: Zeitplanung
    icon: mdi:calendar-clock
    path: zeitplanung
    type: sections
    max_columns: 2
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Saisonales Ladeende & Astro-Modus
            icon: mdi:calendar-clock

      # ── Heute / Morgen ───────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Heute
            icon: mdi:calendar-today

          - type: tile
            entity: sensor.e3dc_maestro_saisonales_ladeende_uhrzeit
            name: Ladeende heute
            icon: mdi:clock-end
            color: purple

          - type: tile
            entity: sensor.e3dc_maestro_astro_ladestart_uhrzeit
            name: Ladestart heute
            icon: mdi:clock-start
            color: amber

      - type: grid
        cards:
          - type: heading
            heading: Morgen
            icon: mdi:calendar-arrow-right

          - type: tile
            entity: sensor.e3dc_maestro_ladeende_morgen_prognose
            name: Ladeende morgen
            icon: mdi:clock-end
            color: deep-purple

          - type: tile
            entity: sensor.e3dc_maestro_ladestart_morgen_prognose
            name: Ladestart morgen
            icon: mdi:clock-start
            color: orange

      # ── Astro-Modus ──────────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Astro-Modus (Phase 7)
            icon: mdi:weather-sunset-up

          - type: entities
            entities:
              - entity: switch.e3dc_maestro_astro_modus_sonnenuberwachung
                name: Astro-Modus aktiv
              - entity: number.e3dc_maestro_ladeende_offset_zu_sonnenuntergang
                name: Offset zu Sonnenuntergang (h)
              - entity: number.e3dc_maestro_ladestart_offset_nach_sonnenaufgang
                name: Offset nach Sonnenaufgang (h)
              - type: button
                name: "Hilfe Astro-Modus"
                icon: mdi:help-circle-outline
                tap_action:
                  action: navigate
                  navigation_path: /e3dc-maestro-modern/help-astro

          - type: markdown
            content: >
              **Standort:** Wird automatisch aus den Home Assistant
              Systemeinstellungen übernommen
              (*Einstellungen → System → Allgemein*).

  # ========================================================================
  # TAB 5: NETZ & TARIF
  # ========================================================================
  - title: Netz & Tarif
    icon: mdi:transmission-tower
    path: tarif
    type: sections
    max_columns: 2
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: HT/NT-Schutz & Dynamischer Tarif
            icon: mdi:transmission-tower

          - type: tile
            entity: switch.e3dc_maestro_ht_nt_schutz
            name: HT/NT-Schutz
            icon: mdi:clock-alert
            color: deep-orange
            tap_action:
              action: toggle

          - type: tile
            entity: binary_sensor.e3dc_maestro_ht_schutz_aktiv
            name: HT aktuell aktiv
            icon: mdi:clock-check
            color: red

